<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Co2Co Editor V3.2</title>
<style>
:root{--bg:#111315;--rail:#15181c;--panel:#181b1f;--panel2:#20242a;--line:#30343b;--text:#f4f1ea;--muted:#a9adb5;--subtle:#6f7682;--blue:#4c8dff;--blue2:#7aa7ff;--ok:#42c77b;--warn:#e8b84a;--err:#f06464;--page:#0b0d10;--dark:#111315;font-family:Inter, Pretendard, SUIT, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{height:100vh;display:grid;grid-template-columns:58px minmax(560px,1fr);grid-template-rows:52px 1fr 34px;background:radial-gradient(circle at 50% -20%,rgba(76,141,255,.18),transparent 36%),#0e1012}.top{grid-column:1/3;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:rgba(17,19,21,.92);backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:10px;font-weight:850}.mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--blue),#8be7dd);box-shadow:0 8px 24px rgba(76,141,255,.28)}.doc-title{color:var(--muted);font-size:13px}.tabs{display:flex;align-items:center;gap:6px}.tab{height:32px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:6px;padding:0 12px}.tab.active{border-color:var(--blue);color:var(--text);background:#1c2432}.top-actions{display:flex;gap:8px;align-items:center}.btn{height:32px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:6px;padding:0 10px}.btn.primary{background:var(--blue);border-color:var(--blue);color:white;font-weight:750}.btn.ghost{background:transparent}.rail{grid-row:2/4;border-right:1px solid var(--line);background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 7px}.tool{width:42px;height:42px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);display:grid;place-items:center;font-size:18px}.tool:hover,.tool.active{background:var(--panel2);border-color:var(--line);color:var(--text)}.left{position:fixed;left:66px;top:62px;bottom:46px;width:268px;z-index:30;border:1px solid var(--line);border-radius:10px;background:rgba(24,27,31,.96);padding:14px;overflow:auto;box-shadow:0 24px 80px rgba(0,0,0,.45);transform:translateX(-360px);opacity:0;pointer-events:none;transition:transform .22s ease,opacity .18s ease}body.show-left .left{transform:translateX(0);opacity:1;pointer-events:auto}.left h2,.inspector h2{font-size:15px;margin:0 0 12px}.group{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.add{height:64px;border:1px solid var(--line);background:#1c2025;color:var(--text);border-radius:8px;display:grid;place-items:center;gap:4px}.add span{font-size:12px;color:var(--muted)}.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.swatch{height:34px;border:1px solid var(--line);border-radius:7px;cursor:pointer;background:linear-gradient(135deg,var(--sw),var(--sw2));box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}.control-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.control-grid .btn{padding:0;font-size:12px}.page-list{display:grid;gap:8px}.page-row{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);background:#1b1f24;border-radius:8px;padding:9px}.page-row.active{border-color:var(--blue)}.page-row input{width:120px;background:transparent;border:0;color:var(--text);outline:0}.stage{grid-column:2;grid-row:2;min-width:0;position:relative;display:grid;place-items:center;padding:18px;overflow:hidden}.canvas-shell{position:relative;width:min(100%,1380px);aspect-ratio:16/9;max-height:calc(100vh - 116px);filter:drop-shadow(0 28px 70px rgba(0,0,0,.42))}.canvas-shell.tablet{width:min(820px,100%);aspect-ratio:4/3}.canvas-shell.mobile{width:min(390px,100%);aspect-ratio:9/16}.canvas{position:absolute;inset:0;overflow:hidden;background:radial-gradient(circle at 78% 18%,rgba(72,199,232,.22),transparent 24%),linear-gradient(135deg,#0b0d10,#151922 55%,#0f1217);border:1px solid rgba(255,255,255,.16);border-radius:10px}.object{position:absolute;border:1px solid transparent;border-radius:6px;min-width:24px;min-height:24px;user-select:none}.object:hover{border-color:rgba(76,141,255,.45)}.object.selected{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue),0 0 0 5px rgba(76,141,255,.16)}.content{width:100%;height:100%;overflow:hidden}.text .content,.button .content{user-select:text}.resize{position:absolute;width:10px;height:10px;right:-6px;bottom:-6px;border:2px solid white;background:var(--blue);border-radius:3px;display:none}.selected .resize{display:block}.mini{position:absolute;left:0;top:-38px;display:none;gap:4px;background:#101317;border:1px solid var(--line);border-radius:7px;padding:4px;z-index:20}.selected .mini{display:flex}.mini button{height:26px;border:0;background:transparent;color:var(--text);padding:0 7px;border-radius:4px}.mini button:hover{background:var(--panel2)}.guide{position:absolute;inset:12px;border:1px dashed rgba(76,141,255,.2);pointer-events:none}.inspector{position:fixed;right:14px;top:62px;bottom:46px;width:318px;z-index:30;border:1px solid var(--line);border-radius:10px;background:rgba(24,27,31,.96);padding:14px;overflow:auto;box-shadow:0 24px 80px rgba(0,0,0,.45);transform:translateX(360px);opacity:0;pointer-events:none;transition:transform .22s ease,opacity .18s ease}body.show-inspector .inspector{transform:translateX(0);opacity:1;pointer-events:auto}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;color:var(--muted)}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#101317;color:var(--text);border-radius:6px;padding:8px}.field textarea{min-height:78px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg{display:flex;gap:5px}.seg .btn.active{border-color:var(--blue);color:white}.bottom{grid-column:2;grid-row:3;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:var(--subtle);font-size:12px;background:rgba(17,19,21,.9)}.toast{position:fixed;left:50%;bottom:46px;transform:translate(-50%,12px);opacity:0;background:#101317;border:1px solid var(--line);padding:10px 13px;border-radius:8px;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}.site-nav{display:flex;align-items:center;justify-content:space-between;padding:22px 30px;color:#121417}.site-logo{font-size:24px;font-weight:900}.site-links{font-size:13px;color:#59616b}.hero-copy{font-weight:900;line-height:.95;color:#f8f3e7}.korean{line-height:1.45;color:#c5cbd3}.glass{background:rgba(17,19,21,.86);color:white;border:1px solid rgba(255,255,255,.18);box-shadow:0 18px 50px rgba(0,0,0,.22)}.media-box{background:linear-gradient(135deg,#16202c,#26313b 55%,#e4d1a2);display:grid;place-items:center;color:white;font-weight:900}.hero-asset{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.04) contrast(1.05)}.premium-card{background:rgba(18,22,28,.82);border:1px solid rgba(255,255,255,.16);box-shadow:0 18px 54px rgba(0,0,0,.36),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(14px)}.audio-card{background:#15191f;color:white;border:1px solid rgba(255,255,255,.12);padding:12px}.audio-card audio{width:100%}.section-band{background:linear-gradient(135deg,#101317,#20242a);border:1px solid rgba(255,255,255,.12)}@media(max-width:1100px){.app{grid-template-columns:54px minmax(520px,1fr);grid-template-rows:52px 1fr 34px}.left{left:62px;top:58px;bottom:40px;width:min(280px,82vw)}.inspector{right:8px;top:58px;bottom:40px;width:min(318px,86vw)}.top{grid-column:1/3}.stage{grid-column:2}.bottom{grid-column:2}.rail{grid-row:2/4}.tabs{max-width:42vw;overflow:auto}.doc-title{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="mark"></div><div>Co2Co</div><div class="doc-title">Comprehensive Commercial Website Solution</div></div>
    <div class="tabs" id="tabs"></div>
    <div class="top-actions">
      <button class="btn ghost" id="undo">↶</button><button class="btn ghost" id="redo">↷</button>
      <div class="seg"><button class="btn active" data-device="desktop">Desktop</button><button class="btn" data-device="tablet">Tablet</button><button class="btn" data-device="mobile">Mobile</button></div>
      <button class="btn" id="reset">초기화</button><button class="btn" id="exportJson">JSON</button><button class="btn" id="exportHtml">HTML</button><button class="btn primary" id="save">저장됨</button>
    </div>
  </header>
  <aside class="rail"><button class="tool active" id="pagesTool" title="페이지">▤</button><button class="tool" id="addTool" title="추가">＋</button><button class="tool" id="layersTool" title="레이어">☷</button><button class="tool" id="themeTool" title="테마">◐</button><button class="tool" id="inspectTool" title="편집">⌘</button></aside>
  <aside class="left"><h2>추가하기</h2><div class="grid2"><button class="add" data-add="text">T<span>텍스트</span></button><button class="add" data-add="button">▣<span>버튼</span></button><button class="add" data-add="image">▧<span>이미지</span></button><button class="add" data-add="video">▶<span>동영상</span></button><button class="add" data-add="audio">♪<span>음악</span></button><button class="add" data-add="section">▥<span>섹션</span></button></div><div class="group"><h2>페이지</h2><div class="page-list" id="pageList"></div><button class="btn" id="addPage" style="width:100%;margin-top:8px">페이지 추가</button></div><div class="group"><h2>색상 팔레트</h2><div class="swatches"><button class="swatch" data-palette="studio" style="--sw:#0b0d10;--sw2:#d9a441" title="Studio"></button><button class="swatch" data-palette="ocean" style="--sw:#0c1820;--sw2:#48c7e8" title="Ocean"></button><button class="swatch" data-palette="paper" style="--sw:#faf7f0;--sw2:#111315" title="Paper"></button><button class="swatch" data-palette="coral" style="--sw:#171012;--sw2:#ff6b57" title="Coral"></button></div></div><div class="group"><h2>관계 정렬</h2><div class="control-grid"><button class="btn" data-align="left">좌</button><button class="btn" data-align="center">중앙</button><button class="btn" data-align="right">우</button><button class="btn" data-align="top">상</button><button class="btn" data-align="middle">중</button><button class="btn" data-align="bottom">하</button></div><div class="control-grid" style="margin-top:6px"><button class="btn" id="distributeH">가로분배</button><button class="btn" id="distributeV">세로분배</button><button class="btn" id="harmonize">함께조절</button></div></div><div class="group"><h2>레이어</h2><div class="control-grid" style="margin-bottom:8px"><button class="btn" id="forward">앞</button><button class="btn" id="backward">뒤</button><button class="btn" id="backmost">맨뒤</button></div><div id="layerList" class="page-list"></div></div></aside>
  <main class="stage"><div class="canvas-shell" id="shell"><div class="canvas" id="canvas"><div class="guide"></div></div></div></main>
  <aside class="inspector"><h2>객체 편집</h2><div id="emptyHint" style="color:var(--muted);font-size:13px;line-height:1.5">객체를 선택하면 위치, 크기, 내용, 색상, 미디어를 조절할 수 있습니다.</div><div id="editorFields" hidden><div class="field"><label>선택 객체</label><input id="objName"></div><div class="field"><label>내용</label><textarea id="objText"></textarea></div><div class="row"><div class="field"><label>X</label><input id="x" type="number"></div><div class="field"><label>Y</label><input id="y" type="number"></div></div><div class="row"><div class="field"><label>W</label><input id="w" type="number"></div><div class="field"><label>H</label><input id="h" type="number"></div></div><div class="row"><div class="field"><label>글자 크기</label><input id="fontSize" type="number"></div><div class="field"><label>굵기</label><select id="fontWeight"><option>400</option><option>600</option><option>750</option><option>900</option></select></div></div><div class="row"><div class="field"><label>글자색</label><input id="color" type="color"></div><div class="field"><label>배경</label><input id="bg" type="color"></div></div><div class="row"><div class="field"><label>둥근값</label><input id="radius" type="number"></div><div class="field"><label>투명도</label><input id="opacity" type="range" min="0.15" max="1" step="0.05"></div></div><div class="field"><label>이미지/동영상/음악 교체</label><input id="mediaFile" type="file" accept="image/*,video/*,audio/*"></div><div class="group"><h2>페이지 색상</h2><div class="row"><div class="field"><label>페이지 배경</label><input id="pageBg" type="color"></div><div class="field"><label>강조색</label><input id="accentColor" type="color"></div></div><button class="btn" id="applyTheme" style="width:100%">페이지 전체 색상 적용</button></div><button class="btn primary" id="apply" style="width:100%">선택 객체에 적용</button><button class="btn" id="duplicate" style="width:100%;margin-top:8px">복제</button><button class="btn" id="remove" style="width:100%;margin-top:8px;color:var(--err)">삭제</button></div></aside>
  <footer class="bottom"><span id="status">준비됨</span><span id="crumb">선택 없음</span></footer>
</div><div class="toast" id="toast"></div>
<script>
const KEY='co2co-editor-v2';
const canvas=document.getElementById('canvas'),shell=document.getElementById('shell'),toast=document.getElementById('toast');
const el=id=>document.getElementById(id);let history=[],future=[],drag=null;
const defaults={text:{text:'새 텍스트',fontSize:34,fontWeight:'750',color:'#111315',bg:'transparent',radius:0,opacity:1},button:{text:'버튼',fontSize:18,fontWeight:'750',color:'#ffffff',bg:'#4c8dff',radius:8,opacity:1},image:{text:'IMAGE',fontSize:18,fontWeight:'900',color:'#ffffff',bg:'#30343b',radius:10,opacity:1,src:''},video:{text:'VIDEO',fontSize:18,fontWeight:'900',color:'#ffffff',bg:'#20242a',radius:10,opacity:1,src:''},audio:{text:'오디오',fontSize:14,fontWeight:'600',color:'#f4f1ea',bg:'#181b1f',radius:10,opacity:1,src:''},section:{text:'',fontSize:14,fontWeight:'400',color:'#ffffff',bg:'#111315',radius:12,opacity:1}};
let state=load()||starter();const palettes={studio:{pageBg:"#0b0d10",accent:"#d9a441",text:"#f8f3e7",muted:"#b9c1cc",panel:"rgba(18,22,28,.86)"},ocean:{pageBg:"#0c1820",accent:"#48c7e8",text:"#f2fbff",muted:"#aac4cf",panel:"rgba(14,32,42,.86)"},paper:{pageBg:"#faf7f0",accent:"#111315",text:"#111315",muted:"#4e5863",panel:"rgba(255,255,255,.86)"},coral:{pageBg:"#171012",accent:"#ff6b57",text:"#fff2ed",muted:"#d3aaa3",panel:"rgba(39,22,24,.86)"}};
function starter(){return{version:2,active:'p1',selected:null,pages:[{id:'p1',name:'소개',theme:{pageBg:'#0b0d10',accent:'#d9a441',text:'#f8f3e7',muted:'#b9c1cc',panel:'rgba(18,22,28,.86)'},objects:[{id:id(),type:'section',x:3,y:4,w:94,h:92,z:0,props:{...defaults.section,bg:'rgba(11,13,16,.72)',radius:18}},{id:id(),type:'text',x:7,y:9,w:34,h:7,z:2,props:{...defaults.text,text:'Co2Co Editor',fontSize:28,fontWeight:'900',color:'#f8f3e7',bg:'transparent'}},{id:id(),type:'text',x:7,y:23,w:44,h:28,z:2,props:{...defaults.text,text:'텍스트, 이미지, 음악, 동영상을\n마술처럼 배치하는\n상업용 웹 편집기',fontSize:47,fontWeight:'900',color:'#f8f3e7',bg:'transparent'}},{id:id(),type:'text',x:7,y:56,w:40,h:13,z:2,props:{...defaults.text,text:'1~3페이지 안에서 모든 객체를 추가, 이동, 크기 조절, 교체, 복제, 삭제할 수 있도록 설계된 Co2Co의 선도형 제작 캔버스입니다.',fontSize:16,fontWeight:'400',color:'#b9c1cc',bg:'transparent'}},{id:id(),type:'button',x:7,y:76,w:18,h:8,z:2,props:{...defaults.button,text:'시작하기',fontSize:18,bg:'#d9a441',color:'#111315',radius:8}},{id:id(),type:'button',x:27,y:76,w:17,h:8,z:2,props:{...defaults.button,text:'미리보기',fontSize:18,bg:'#1e242c',color:'#f8f3e7',radius:8}},{id:id(),type:'image',x:52,y:12,w:39,h:56,z:2,props:{...defaults.image,text:'PREMIUM VISUAL',bg:'#15191f',radius:16,src:'assets/co2co-editor-hero.png'}},{id:id(),type:'section',x:55,y:72,w:32,h:15,z:3,props:{...defaults.section,bg:'rgba(18,22,28,.86)',radius:14}},{id:id(),type:'text',x:58,y:75,w:26,h:8,z:4,props:{...defaults.text,text:'Studio Precision\n선택 · 이동 · 리사이즈 · 미디어 교체',fontSize:15,fontWeight:'750',color:'#f4f1ea',bg:'transparent'}},{id:id(),type:'audio',x:58,y:86,w:28,h:8,z:4,props:{...defaults.audio,text:'브랜드 사운드'}}]}]}}
function id(){return'M'+Math.random().toString(36).slice(2,9)}function activePage(){const p=state.pages.find(p=>p.id===state.active);p.theme=p.theme||{...palettes.studio};return p}function selectedObj(){return activePage().objects.find(o=>o.id===state.selected)}
function load(){try{const raw=localStorage.getItem(KEY);return raw?JSON.parse(raw).document:null}catch{return null}}function persist(){try{localStorage.setItem(KEY,JSON.stringify({version:2,savedAt:Date.now(),document:state}));el('save').textContent='저장됨'}catch(e){el('save').textContent='저장 실패';show('저장 공간이 부족합니다. 큰 미디어는 줄여주세요')}}function snap(){history.push(JSON.stringify(state));if(history.length>80)history.shift();future=[];el('save').textContent='저장 중'}function restore(s){state=JSON.parse(s);render();persist()}function show(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200)}
function render(){renderTabs();renderLayers();canvas.style.background='radial-gradient(circle at 78% 18%,'+hexToRgba(activePage().theme.accent,.22)+',transparent 24%),linear-gradient(135deg,'+activePage().theme.pageBg+',#151922 55%,#0f1217)';canvas.innerHTML='<div class="guide"></div>';activePage().objects.sort((a,b)=>a.z-b.z).forEach(o=>canvas.appendChild(renderObject(o)));renderInspector();el('status').textContent=`${activePage().name} · 객체 ${activePage().objects.length}개`;el('crumb').textContent=state.selected?`${selectedObj()?.type||''} / ${state.selected}`:'선택 없음'}
function renderTabs(){el('tabs').innerHTML='';state.pages.forEach(p=>{const b=document.createElement('button');b.className='tab'+(p.id===state.active?' active':'');b.textContent=p.name;b.onclick=()=>{state.active=p.id;state.selected=null;render();persist()};el('tabs').appendChild(b)})}
function renderLayers(){el('pageList').innerHTML='';state.pages.forEach(p=>{const r=document.createElement('div');r.className='page-row'+(p.id===state.active?' active':'');r.innerHTML=`<input value="${p.name}"><button class="btn">보기</button>`;r.querySelector('input').onchange=e=>{p.name=e.target.value||p.name;render();persist()};r.querySelector('button').onclick=()=>{state.active=p.id;state.selected=null;render();persist()};el('pageList').appendChild(r)});el('layerList').innerHTML='';[...activePage().objects].sort((a,b)=>b.z-a.z).forEach(o=>{const r=document.createElement('div');r.className='page-row'+(o.id===state.selected?' active':'');r.innerHTML=`<span>${o.type}</span><button class="btn">선택</button>`;r.querySelector('button').onclick=()=>select(o.id);el('layerList').appendChild(r)})}
function renderObject(o){const d=document.createElement('div');d.className=`object ${o.type} ${o.id===state.selected?'selected':''}`;d.dataset.id=o.id;Object.assign(d.style,{left:o.x+'%',top:o.y+'%',width:o.w+'%',height:o.h+'%',zIndex:o.z,opacity:o.props.opacity??1,borderRadius:(o.props.radius||0)+'px'});const c=document.createElement('div');c.className='content';Object.assign(c.style,{fontSize:(o.props.fontSize||16)+'px',fontWeight:o.props.fontWeight||400,color:o.props.color||'#111',background:o.props.bg||'transparent',borderRadius:(o.props.radius||0)+'px'});if(o.type==='text'){c.textContent=o.props.text;c.contentEditable=true;c.style.whiteSpace='pre-wrap';c.oninput=()=>{o.props.text=c.textContent;persist()}}else if(o.type==='button'){c.textContent=o.props.text;c.contentEditable=true;c.style.display='grid';c.style.placeItems='center';c.oninput=()=>{o.props.text=c.textContent;persist()}}else if(o.type==='image'){if(o.props.src){c.innerHTML=`<img class="hero-asset" src="${o.props.src}">`}else{c.className+=' media-box';c.textContent=o.props.text}}else if(o.type==='video'){c.innerHTML=o.props.src?`<video src="${o.props.src}" controls style="width:100%;height:100%;object-fit:cover"></video>`:`<div class="media-box" style="width:100%;height:100%">VIDEO</div>`}else if(o.type==='audio'){c.className+=' audio-card';c.innerHTML=`<div style="font-size:12px;margin-bottom:6px;color:#a9adb5">${o.props.text||'오디오'}</div><audio controls preload="metadata" ${o.props.src?`src="${o.props.src}"`:''}></audio>`}else if(o.type==='section'){c.className+=' section-band'}const mini=document.createElement('div');mini.className='mini';mini.innerHTML='<button data-act="front">앞</button><button data-act="copy">복제</button><button data-act="del">삭제</button>';mini.onclick=e=>{e.stopPropagation();const a=e.target.dataset.act;if(a==='copy')duplicate();if(a==='del')remove();if(a==='front'){snap();o.z=Math.max(...activePage().objects.map(x=>x.z))+1;render();persist()}};d.append(c,mini,Object.assign(document.createElement('div'),{className:'resize'}));d.onpointerdown=e=>startPointer(e,o,d);d.onclick=e=>{e.stopPropagation();select(o.id)};return d}
function select(idv){state.selected=idv;document.body.classList.add('show-inspector');render();persist()}
function startPointer(e,o,d){if(e.target.closest('audio,video,input,textarea')||e.target.isContentEditable)return;snap();select(o.id);const rect=canvas.getBoundingClientRect(),res=e.target.classList.contains('resize');drag={id:o.id,res,startX:e.clientX,startY:e.clientY,ox:o.x,oy:o.y,ow:o.w,oh:o.h,cw:rect.width,ch:rect.height,node:d};d.setPointerCapture(e.pointerId)}
document.onpointermove=e=>{if(!drag)return;const o=selectedObj();if(!o)return;const dx=(e.clientX-drag.startX)/drag.cw*100,dy=(e.clientY-drag.startY)/drag.ch*100;if(drag.res){o.w=Math.max(4,Math.min(100-o.x,drag.ow+dx));o.h=Math.max(4,Math.min(100-o.y,drag.oh+dy))}else{o.x=Math.max(0,Math.min(100-o.w,drag.ox+dx));o.y=Math.max(0,Math.min(100-o.h,drag.oy+dy))}if(drag.node){drag.node.style.left=o.x+'%';drag.node.style.top=o.y+'%';drag.node.style.width=o.w+'%';drag.node.style.height=o.h+'%'}renderInspector()};document.onpointerup=()=>{if(drag){drag=null;render();persist()}};
function add(type){snap();const z=Math.max(0,...activePage().objects.map(o=>o.z))+1;const size={text:[10,18,34,12],button:[12,74,18,8],image:[58,18,28,24],video:[58,45,28,22],audio:[58,72,30,10],section:[8,18,84,24]}[type];const o={id:id(),type,x:size[0],y:size[1],w:size[2],h:size[3],z,props:{...defaults[type]}};activePage().objects.push(o);state.selected=o.id;render();persist();show(`${type} 추가됨`)}
function duplicate(){const o=selectedObj();if(!o)return;snap();const n=JSON.parse(JSON.stringify(o));n.id=id();n.x=Math.min(95-n.w,o.x+3);n.y=Math.min(95-n.h,o.y+3);n.z=Math.max(...activePage().objects.map(x=>x.z))+1;activePage().objects.push(n);state.selected=n.id;render();persist()}function remove(){if(!state.selected)return;snap();activePage().objects=activePage().objects.filter(o=>o.id!==state.selected);state.selected=null;render();persist()}function clampObj(o){o.w=Math.max(4,Math.min(100,Number(o.w)||4));o.h=Math.max(4,Math.min(100,Number(o.h)||4));o.x=Math.max(0,Math.min(100-o.w,Number(o.x)||0));o.y=Math.max(0,Math.min(100-o.h,Number(o.y)||0))}function apply(){const o=selectedObj();if(!o)return;snap();['x','y','w','h'].forEach(k=>o[k]=Number(el(k).value));clampObj(o);o.props.text=el('objText').value;o.props.fontSize=Number(el('fontSize').value)||o.props.fontSize;o.props.fontWeight=el('fontWeight').value;o.props.color=el('color').value;o.props.bg=el('bg').value;o.props.radius=Number(el('radius').value)||0;o.props.opacity=Number(el('opacity').value);render();persist()}
function renderInspector(){if(el('pageBg')){el('pageBg').value=color(activePage().theme.pageBg);el('accentColor').value=color(activePage().theme.accent)}const o=selectedObj();el('emptyHint').hidden=!!o;el('editorFields').hidden=!o;if(!o)return;el('objName').value=o.type;el('objText').value=o.props.text||'';['x','y','w','h'].forEach(k=>el(k).value=Math.round(o[k]));el('fontSize').value=o.props.fontSize||16;el('fontWeight').value=o.props.fontWeight||400;el('color').value=color(o.props.color||'#111315');el('bg').value=color(o.props.bg||'#ffffff');el('radius').value=o.props.radius||0;el('opacity').value=o.props.opacity??1}
function color(v){return !v||v==='transparent'||v.startsWith('rgba')?'#ffffff':v}function hexToRgba(hex,a){const h=hex.replace('#','');const n=parseInt(h,16);return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'}
function fileToDataUrl(file){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(file)})}
el('mediaFile').onchange=async e=>{const o=selectedObj(),file=e.target.files[0];if(!o||!file)return;snap();o.props.src=await fileToDataUrl(file);if(o.type==='audio')o.props.text=file.name;render();persist();show('미디어가 연결되었습니다')};
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));el('apply').onclick=apply;el('duplicate').onclick=duplicate;el('remove').onclick=remove;el('save').onclick=()=>{persist();show('저장되었습니다')};el('reset').onclick=()=>{if(confirm('현재 브라우저에 저장된 편집 상태를 지우고 V3 기본 화면으로 되돌릴까요?')){localStorage.removeItem(KEY);state=starter();history=[];future=[];render();persist();show('초기화되었습니다')}};el('addPage').onclick=()=>{if(state.pages.length>=3)return show('페이지는 최대 3개입니다');snap();const p={id:id(),name:`${state.pages.length+1}페이지`,objects:[]};state.pages.push(p);state.active=p.id;state.selected=null;render();persist()};el('undo').onclick=()=>{if(history.length){future.push(JSON.stringify(state));restore(history.pop())}};el('redo').onclick=()=>{if(future.length){history.push(JSON.stringify(state));restore(future.pop())}};document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-device]').forEach(x=>x.classList.remove('active'));b.classList.add('active');shell.className='canvas-shell '+(b.dataset.device==='desktop'?'':b.dataset.device)});el('inspectTool').onclick=()=>document.body.classList.toggle('show-inspector');['pagesTool','addTool','layersTool','themeTool'].forEach(id=>el(id).onclick=()=>document.body.classList.toggle('show-left'));canvas.onclick=e=>{if(e.target===canvas||e.target.classList.contains('guide')){state.selected=null;document.body.classList.remove('show-inspector');render();persist()}};document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('show-left','show-inspector')}});document.querySelectorAll('[data-palette]').forEach(b=>b.onclick=()=>applyPalette(b.dataset.palette));document.querySelectorAll('[data-align]').forEach(b=>b.onclick=()=>alignSelected(b.dataset.align));el('applyTheme').onclick=applyTheme;el('distributeH').onclick=()=>distribute('x');el('distributeV').onclick=()=>distribute('y');el('harmonize').onclick=harmonize;el('forward').onclick=()=>layer('front');el('backward').onclick=()=>layer('back');el('backmost').onclick=()=>layer('backmost');
function applyPalette(name){const pal=palettes[name];if(!pal)return;snap();const page=activePage();page.theme={...pal};page.objects.forEach(o=>{if(o.type==='section'){o.props.bg=pal.panel}else if(o.type==='text'){o.props.color=o.props.color===page.theme?.muted?pal.muted:pal.text;o.props.bg='transparent'}else if(o.type==='button'){o.props.bg=pal.accent;o.props.color=name==='paper'?'#ffffff':'#111315'}else if(o.type==='audio'){o.props.bg=pal.panel;o.props.color=pal.text}});render();persist();show('색상 팔레트가 적용되었습니다')}
function applyTheme(){snap();const page=activePage();page.theme={...(page.theme||{}),pageBg:el('pageBg').value,accent:el('accentColor').value};page.objects.forEach(o=>{if(o.type==='button')o.props.bg=page.theme.accent;if(o.type==='section')o.props.bg=page.theme.panel||o.props.bg});render();persist();show('페이지 전체 색상이 조절되었습니다')}
function alignSelected(where){const o=selectedObj();if(!o)return;snap();if(where==='left')o.x=5;if(where==='center')o.x=(100-o.w)/2;if(where==='right')o.x=95-o.w;if(where==='top')o.y=5;if(where==='middle')o.y=(100-o.h)/2;if(where==='bottom')o.y=95-o.h;clampObj(o);render();persist()}
function distribute(axis){const objs=activePage().objects.filter(o=>o.type!=='section').sort((a,b)=>axis==='x'?a.x-b.x:a.y-b.y);if(objs.length<3)return show('분배하려면 섹션 제외 객체가 3개 이상 필요합니다');snap();const start=8,end=92,step=(end-start)/(objs.length-1);objs.forEach((o,i)=>{if(axis==='x')o.x=Math.max(0,Math.min(100-o.w,start+i*step-o.w/2));else o.y=Math.max(0,Math.min(100-o.h,start+i*step-o.h/2))});render();persist();show(axis==='x'?'가로 간격을 맞췄습니다':'세로 간격을 맞췄습니다')}
function harmonize(){snap();const page=activePage();const t=page.theme||palettes.studio;page.objects.forEach(o=>{if(o.type==='text'){o.props.color=(o.props.fontWeight==='400')?t.muted:t.text;o.props.bg='transparent'}if(o.type==='button'){o.props.bg=t.accent;o.props.color=t.pageBg==='#faf7f0'?'#ffffff':'#111315'}if(o.type==='section'){o.props.bg=t.panel||hexToRgba(t.accent,.16)}if(o.type==='audio'){o.props.bg=t.panel;o.props.color=t.text}});render();persist();show('하나의 변화가 전체 톤에 반영되었습니다')}
function layer(delta){const o=selectedObj();if(!o)return;snap();if(delta==='front')o.z=Math.max(...activePage().objects.map(x=>x.z))+1;else if(delta==='back')o.z=Math.max(0,o.z-1);else o.z=0;render();persist()}
function exportJson(){download('co2co-project.json',JSON.stringify(state,null,2),'application/json')}function exportHtml(){const pages=state.pages.map(p=>`<section class="page">${p.objects.map(o=>objectHtml(o)).join('')}</section>`).join('');download('co2co-export.html',`<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Co2Co</title><style>body{margin:0;font-family:Inter,Pretendard,system-ui,sans-serif;background:#111}.page{position:relative;width:100vw;height:100vh;overflow:hidden;background:#f7f4ec}.obj{position:absolute;overflow:hidden}</style>${pages}</html>`,'text/html')}function objectHtml(o){const s=`left:${o.x}%;top:${o.y}%;width:${o.w}%;height:${o.h}%;z-index:${o.z};opacity:${o.props.opacity};border-radius:${o.props.radius}px;color:${o.props.color};background:${o.props.bg};font-size:${o.props.fontSize}px;font-weight:${o.props.fontWeight};`;let inner=o.props.text||'';if(o.type==='image'&&o.props.src)inner=`<img src="${o.props.src}" style="width:100%;height:100%;object-fit:cover">`;if(o.type==='video'&&o.props.src)inner=`<video src="${o.props.src}" controls style="width:100%;height:100%;object-fit:cover"></video>`;if(o.type==='audio')inner=`<audio controls src="${o.props.src||''}" style="width:100%"></audio>`;return`<div class="obj" style="${s}">${inner}</div>`}function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}el('exportJson').onclick=exportJson;el('exportHtml').onclick=exportHtml;document.addEventListener('keydown',e=>{if(e.key==='Delete')remove();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){e.preventDefault();duplicate()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();persist();show('저장되었습니다')}});
render();persist();
</script>
