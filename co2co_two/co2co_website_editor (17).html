<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>co2co website editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">

<!-- ============ 실제로 만들어지는 웹페이지에 그대로 쓰이는 스타일 (내보내기 시 이 부분만 사용됨) ============ -->
<style id="siteStyles">
:root{ --accent:#2F6F5E; --accent-light:#4C9484; --border:#D8D3C8; --text-mid:#6B736C; }
*{box-sizing:border-box;}
body{margin:0;font-family:'Pretendard',-apple-system,sans-serif;color:#20241F;background:#EDEAE3;}
.page{position:relative;max-width:1100px;margin:0 auto;background:#FAF8F4;box-shadow:0 20px 60px rgba(0,0,0,.12);min-height:200px;overflow:hidden;}
.block{position:relative;}
.pad-sm{padding:16px 48px;}
.pad-md{padding:40px 64px;}
.pad-lg{padding:96px 64px;}
.align-left{text-align:left;}
.align-center{text-align:center;}
.align-right{text-align:right;}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;font-weight:700;line-height:1.2;margin:0 0 12px;}
p{margin:0 0 8px;line-height:1.7;color:#3B423C;}
.header-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;}
.navlinks{display:flex;gap:24px;flex-wrap:wrap;}
.navlinks a{color:inherit;text-decoration:none;font-weight:500;font-size:14px;}
.hero-inner .eyebrow{color:var(--accent);font-weight:700;letter-spacing:.08em;font-size:12px;text-transform:uppercase;display:block;margin-bottom:10px;}
.hero-inner h1{font-size:clamp(30px,5vw,52px);margin:0 0 16px;}
.hero-inner p{font-size:17px;max-width:560px;margin:0 auto 24px;color:#4A524B;}
.btn{display:inline-block;padding:13px 30px;border-radius:999px;text-decoration:none;font-weight:600;font-size:14px;background:var(--accent);color:#fff;border:2px solid var(--accent);}
.btn:hover{background:var(--accent-light);border-color:var(--accent-light);}
.text-inner h2{font-size:26px;}
.text-inner p{font-size:15px;max-width:720px;}
.img-placeholder{aspect-ratio:4/3;background:#EFECE4;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-mid);cursor:pointer;font-size:13px;border-radius:10px;overflow:hidden;}
.image-inner .img-placeholder{aspect-ratio:auto;width:100%;height:100%;}
.video-inner .img-placeholder{aspect-ratio:auto;width:100%;height:100%;}
.video-inner .video-wrap{height:100%;padding-top:0;}
.img-placeholder.has-img{border-style:solid;border-color:transparent;}
.img-placeholder img{width:100%;height:100%;object-fit:cover;display:block;}
.img-placeholder.rounded{border-radius:20px;}
.img-caption{font-size:13px;color:var(--text-mid);text-align:center;margin-top:10px;}
.gallery-grid{display:grid;gap:14px;grid-template-columns:repeat(3,1fr);}
.gallery-grid.cols-2{grid-template-columns:repeat(2,1fr);}
.gallery-grid.cols-4{grid-template-columns:repeat(4,1fr);}
.twocol-inner{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;}
.twocol-inner h3{font-size:22px;}
.twocol-inner p{font-size:15px;color:#4A524B;}
.cards-inner{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:28px 24px;}
.card-icon{font-size:26px;display:block;margin-bottom:12px;}
.card h3{font-size:17px;}
.card p{font-size:14px;color:#4A524B;margin:0;}
.contact-inner h2{font-size:24px;}
.contact-inner>p{color:#4A524B;font-size:14px;margin-bottom:20px;}
.contact-inner form{display:grid;gap:12px;max-width:460px;margin:0 auto;text-align:left;}
.contact-inner input,.contact-inner textarea{padding:12px 14px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px;background:#fff;width:100%;}
.contact-inner textarea{min-height:110px;resize:vertical;}
.contact-inner .btn{border:none;cursor:pointer;}
.social-row{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;}
.social-row a{color:var(--accent);font-weight:600;text-decoration:none;font-size:14px;}
.video-wrap{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;}
.video-wrap iframe,.video-wrap video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000;object-fit:cover;}
.youtube-fallback{position:absolute;right:10px;bottom:10px;z-index:3;background:rgba(0,0,0,.72);color:#fff;text-decoration:none;font-size:12px;font-weight:700;padding:7px 10px;border-radius:999px;}
.video-placeholder{aspect-ratio:16/9;}
.divider-inner hr{border:none;border-top:1px solid var(--border);}
.footer-inner p{font-size:13px;color:var(--text-mid);margin:0;}
.layer-stack{position:relative;width:100%;height:100%;border-radius:10px;overflow:hidden;background:#EFECE4;}
.layer-item{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .6s ease;display:flex;align-items:center;justify-content:center;color:var(--text-mid);font-size:12px;text-align:center;line-height:1.6;}
.layer-item.active{opacity:1;z-index:1;}
.layer-item img{width:100%;height:100%;object-fit:cover;display:block;}
.freeform{min-height:1.4em;}
.block[data-type="plainblock"]{box-shadow:0 6px 20px rgba(0,0,0,.10);border-radius:8px;cursor:default;}
.block[data-type="image"],.block[data-type="video"],.block[data-type="layer"]{box-shadow:0 6px 20px rgba(0,0,0,.10);border-radius:8px;cursor:default;}
.block.chrome-off{background:transparent!important;border-color:transparent!important;box-shadow:none!important;}
.block.chrome-off .img-placeholder{border-color:transparent;background:transparent;}
.block.chrome-off .video-wrap,.block.chrome-off .img-placeholder,.block.chrome-off .layer-stack{border-radius:inherit;}
.block[data-type="plainblock"] .drag-handle,.block[data-type="image"] .drag-handle,.block[data-type="video"] .drag-handle,.block[data-type="layer"] .drag-handle{cursor:grab;}
.block[data-type="plainblock"] .drag-handle:active,.block[data-type="image"] .drag-handle:active,.block[data-type="video"] .drag-handle:active,.block[data-type="layer"] .drag-handle:active{cursor:grabbing;}
.co2co-responsive-note{display:none;}
@media (max-width:820px){
  body{overflow-x:hidden;}
  .page{width:100%!important;max-width:100%!important;margin-left:0!important;margin-right:0!important;box-shadow:none;}
  .twocol-inner{grid-template-columns:1fr;}
  .cards-inner{grid-template-columns:1fr;}
  .gallery-grid,.gallery-grid.cols-2,.gallery-grid.cols-3,.gallery-grid.cols-4{grid-template-columns:1fr!important;}
  .pad-lg{padding:56px 28px;}
  .pad-md{padding:28px 28px;}
  .pad-sm{padding:14px 20px;}
  .header-inner{flex-direction:column;align-items:flex-start;}
  .navlinks{gap:12px;}
  .hero-inner h1{font-size:clamp(28px,11vw,42px);}
  .hero-inner p{font-size:15px;}
  .block[data-type="plainblock"],.block[data-type="image"],.block[data-type="video"],.block[data-type="layer"]{
    position:relative!important;
    left:auto!important;
    top:auto!important;
    width:auto!important;
    max-width:100%!important;
    height:auto!important;
    min-height:0;
    margin:16px 20px;
    resize:none!important;
    z-index:auto!important;
  }
  .block[data-type="image"] .image-inner,.block[data-type="video"] .video-inner,.block[data-type="layer"] .layer-inner{min-height:220px;}
  .co2co-responsive-note{display:block;padding:10px 20px;font-size:12px;color:var(--text-mid);background:#fff8;border-top:1px solid var(--border);}
}
</style>

<!-- ============ 편집기 화면(UI) 전용 스타일: 내보내기에는 포함되지 않음 ============ -->
<style id="editorChrome">
:root{ --ink:#14181A; --panel:#1B211F; --panel-light:#232A28; --amber:#E8A33D; }
html,body{height:100%;}
#app{height:100vh;display:flex;flex-direction:column;overflow:hidden;}
#topbar{min-height:56px;flex:0 0 auto;background:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:8px 20px;color:#EDEAE3;position:relative;z-index:30;gap:12px;}
.brand{display:flex;align-items:baseline;gap:8px;}
.brand-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;letter-spacing:-.02em;}
.brand-tag{font-size:11px;color:#8A9490;}
#pageTitleInput{background:transparent;border:1px solid transparent;color:#EDEAE3;font-size:14px;padding:7px 12px;border-radius:6px;text-align:center;width:260px;font-family:inherit;}
#pageTitleInput:hover,#pageTitleInput:focus{border-color:#333;outline:none;background:#202623;}
#topActions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
#topActions button{padding:8px 16px;border-radius:8px;border:1px solid #333;background:transparent;color:#EDEAE3;font-size:13px;cursor:pointer;font-family:inherit;}
#topActions button:hover{border-color:var(--accent);color:var(--accent-light);}
#topActions .btn-accent{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
#topActions .btn-accent:hover{background:var(--accent-light);}
.mobile-toggle{display:none!important;}
.theme-panel{position:absolute;top:44px;right:0;background:var(--panel);border:1px solid #333;border-radius:12px;padding:14px;display:none;gap:10px;z-index:60;box-shadow:0 12px 30px rgba(0,0,0,.35);}
.align-panel{flex-direction:column;right:auto;left:0;min-width:120px;}
.align-panel button{padding:9px 14px;border-radius:8px;border:1px solid #333;background:#202623;color:#EDEAE3;font-size:13px;cursor:pointer;font-family:inherit;text-align:left;}
.align-panel button:hover{border-color:var(--accent);color:var(--accent-light);}
.theme-panel.show{display:flex;}
.theme-swatch{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.3);cursor:pointer;padding:0;flex:0 0 auto;}
.theme-swatch:hover{transform:scale(1.12);}
.page.selected-page{outline:2px dashed var(--accent);outline-offset:3px;}
#workspace{flex:1;display:flex;overflow:hidden;}
#palette{width:230px;flex:0 0 230px;background:var(--panel);padding:18px 16px;overflow-y:auto;}
#palette h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8A9490;margin:0 0 10px;font-weight:700;}
.pal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px;}
.pal-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;background:var(--panel-light);border:1px solid transparent;border-radius:10px;color:#EDEAE3;cursor:grab;font-size:12px;font-family:inherit;transition:.15s;}
.pal-item:hover{border-color:var(--accent);background:#26302C;}
.pal-icon{font-size:20px;}
#canvasWrap{flex:1;overflow-y:auto;padding:48px 24px;background:#EDEAE3;}
.page{position:relative;}
#canvas:empty::before{content:'왼쪽에서 원하는 구성 요소를 클릭하거나\A 끌어다 놓아서 이 페이지를 자유롭게 꾸며보세요.';white-space:pre-line;display:block;text-align:center;padding:140px 40px;color:#8B8578;font-size:15px;line-height:1.9;}
.freeform:empty::before{content:'클릭해서 자유롭게 내용을 입력하세요...';color:#9AA39C;}
.block:hover,.block.selected{outline:2px dashed var(--accent);outline-offset:-2px;}
.block-tag{display:none;position:absolute;top:0;left:0;background:var(--accent);color:#fff;font-size:11px;padding:3px 9px;font-weight:700;border-radius:0 0 6px 0;z-index:500;letter-spacing:.02em;font-family:'Pretendard',sans-serif;}
.block:hover .block-tag,.block.selected .block-tag{display:block;}
.block-toolbar{display:none;position:absolute;top:0;right:0;background:var(--ink);border-radius:0 0 0 6px;overflow:hidden;z-index:501;}
.block:hover .block-toolbar,.block.selected .block-toolbar{display:flex;}
.block-toolbar button{width:30px;height:26px;border:none;background:transparent;color:#fff;cursor:pointer;font-size:12px;}


#inspector{width:270px;flex:0 0 270px;background:var(--panel);padding:20px 18px;overflow-y:auto;color:#EDEAE3;}
.block[data-type="plainblock"]{resize:both;overflow:auto;min-width:160px;min-height:60px;}
.block[data-type="image"]{resize:both;overflow:hidden;min-width:120px;min-height:100px;}
.block[data-type="video"]{resize:both;overflow:hidden;min-width:160px;min-height:110px;}
.block[data-type="layer"]{resize:both;overflow:hidden;min-width:140px;min-height:120px;}
.block.chrome-off{resize:none!important;}
#inspector h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8A9490;margin:0 0 14px;font-weight:700;}
.insp-tag{background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px;}
.insp-label{display:block;font-size:12px;color:#8A9490;margin:18px 0 6px;font-weight:600;}
.insp-label:first-of-type{margin-top:0;}
#inspectorBody input[type=color]{width:100%;height:36px;border:none;border-radius:8px;cursor:pointer;background:transparent;padding:0;}
#inspectorBody select,#inspectorBody input[type=text]{width:100%;padding:9px 10px;border-radius:8px;border:1px solid #333;background:#202623;color:#EDEAE3;font-family:inherit;font-size:13px;}
#inspectorBody input[type=range]{width:100%;margin:6px 0;accent-color:var(--accent);cursor:pointer;}
.insp-btnrow{display:flex;gap:6px;}
.insp-btnrow button{flex:1;padding:8px 0;border-radius:8px;border:1px solid #333;background:#202623;color:#EDEAE3;cursor:pointer;font-size:12px;font-family:inherit;}
.insp-btnrow button:hover{border-color:var(--accent);color:var(--accent-light);}
.insp-check{display:flex;align-items:center;gap:8px;font-size:13px;color:#c9d0cb;margin-top:4px;}
.insp-delete{margin-top:30px;width:100%;padding:11px;border-radius:8px;border:1px solid #7A3B34;background:transparent;color:#E4695C;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;}
.insp-delete:hover{background:#7A3B34;color:#fff;}
.insp-empty{color:#8A9490;font-size:13px;line-height:1.8;text-align:center;margin-top:70px;}
.insp-note{font-size:12px;color:#8A9490;line-height:1.7;margin-top:14px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 22px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:200;border:1px solid #333;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.storage-meter{height:7px;background:#303735;border-radius:999px;overflow:hidden;margin-top:10px;}
.storage-meter span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s;}
body.preview-mode #palette,body.preview-mode #inspector,body.preview-mode .block-toolbar,body.preview-mode .block-tag{display:none!important;}
body.preview-mode .block{outline:none!important;resize:none!important;}
body.preview-mode #canvasWrap{padding:0;background:#FAF8F4;}
body.preview-mode .page{box-shadow:none;}
@media (max-width:980px){
  #topbar{align-items:flex-start;flex-wrap:wrap;}
  .brand{width:100%;}
  #pageTitleInput{flex:1;min-width:180px;text-align:left;}
  .mobile-toggle{display:inline-flex!important;}
  #workspace{position:relative;}
  #palette,#inspector{position:fixed;top:0;bottom:0;z-index:120;width:min(86vw,320px);box-shadow:0 18px 50px rgba(0,0,0,.42);transform:translateX(-110%);transition:transform .22s ease;}
  #palette{left:0;padding-top:78px;}
  #inspector{right:0;transform:translateX(110%);padding-top:78px;}
  body.palette-open #palette,body.inspector-open #inspector{transform:translateX(0);}
  body.palette-open::after,body.inspector-open::after{content:'';position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:90;}
  #canvasWrap{padding:24px 12px;}
  .page{max-width:100%;width:100%;}
  .block-toolbar{display:flex;}
  .block-toolbar button{width:34px;height:30px;}
}
@media (max-width:640px){
  #topbar{padding:8px 10px;}
  .brand-tag{display:none;}
  #topActions{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;}
  #topActions button{padding:8px 6px;font-size:12px;min-width:0;}
  #pageTitleInput{width:100%;order:2;}
  #canvasWrap{padding:14px 0;}
  #canvas:empty::before{padding:90px 24px;font-size:14px;}
  .toast{left:12px;right:12px;bottom:16px;transform:translateY(20px);text-align:center;}
  .toast.show{transform:translateY(0);}
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <span class="brand-name">co2co</span>
      <span class="brand-tag" title="자유로운 변화 조절! 바꿀 수 있는 것은 모두 자유롭게 바꿀 수 있다.">website editor · 자유로운 변화 조절!</span>
    </div>
    <input id="pageTitleInput" type="text" value="제목 없는 페이지">
    <div id="topActions" style="position:relative;">
      <button class="mobile-toggle" onclick="togglePanel('palette')">블록</button>
      <button id="themeBtn" onclick="toggleThemePanel()">전체 색상</button>
      <div id="themePanel" class="theme-panel"></div>
      <button id="alignBtn" onclick="toggleAlignPanel()">전체 정렬</button>
      <div id="alignPanel" class="theme-panel align-panel">
        <button onclick="applyGlobalAlign('left')">왼쪽</button>
        <button onclick="applyGlobalAlign('center')">가운데</button>
        <button onclick="applyGlobalAlign('right')">오른쪽</button>
        <button onclick="nudgeAll(-1,0)">전체 ←</button>
        <button onclick="nudgeAll(1,0)">전체 →</button>
        <button onclick="nudgeAll(0,-1)">전체 ↑</button>
        <button onclick="nudgeAll(0,1)">전체 ↓</button>
      </div>
      <button class="mobile-toggle" onclick="togglePanel('inspector')">설정</button>
      <button id="previewBtn" onclick="togglePreview()">미리보기</button>
      <button onclick="undoAction()">되돌리기</button>
      <button onclick="savePage()">저장</button>
      <button onclick="loadPage(true)">불러오기</button>
      <button class="btn-accent" onclick="exportHTML()">내보내기</button>
      <button onclick="resetPage()">초기화</button>
    </div>
  </header>

  <div id="workspace">
    <aside id="palette">
      <h4>기본</h4>
      <div class="pal-grid">
        <button class="pal-item" draggable="true" data-type="section" ondragstart="onPalDragStart(event)" onclick="addBlock('section')"><span class="pal-icon">▭</span><span>섹션</span></button>
        <button class="pal-item" draggable="true" data-type="plainblock" ondragstart="onPalDragStart(event)" onclick="addBlock('plainblock')"><span class="pal-icon">▫</span><span>블록</span></button>
      </div>
      <h4>구조</h4>
      <div class="pal-grid">
        <button class="pal-item" draggable="true" data-type="header" ondragstart="onPalDragStart(event)" onclick="addBlock('header')"><span class="pal-icon">🧭</span><span>헤더</span></button>
        <button class="pal-item" draggable="true" data-type="hero" ondragstart="onPalDragStart(event)" onclick="addBlock('hero')"><span class="pal-icon">🌟</span><span>히어로</span></button>
        <button class="pal-item" draggable="true" data-type="twocol" ondragstart="onPalDragStart(event)" onclick="addBlock('twocol')"><span class="pal-icon">▥</span><span>2단 배치</span></button>
        <button class="pal-item" draggable="true" data-type="cards" ondragstart="onPalDragStart(event)" onclick="addBlock('cards')"><span class="pal-icon">🗂️</span><span>카드</span></button>
        <button class="pal-item" draggable="true" data-type="footer" ondragstart="onPalDragStart(event)" onclick="addBlock('footer')"><span class="pal-icon">⬛</span><span>푸터</span></button>
      </div>
      <h4>콘텐츠</h4>
      <div class="pal-grid">
        <button class="pal-item" draggable="true" data-type="layer" ondragstart="onPalDragStart(event)" onclick="addBlock('layer')"><span class="pal-icon">📚</span><span>레이어</span></button>
        <button class="pal-item" draggable="true" data-type="image" ondragstart="onPalDragStart(event)" onclick="addBlock('image')"><span class="pal-icon">🖼️</span><span>이미지</span></button>
        <button class="pal-item" draggable="true" data-type="gallery" ondragstart="onPalDragStart(event)" onclick="addBlock('gallery')"><span class="pal-icon">🎞️</span><span>갤러리</span></button>
        <button class="pal-item" draggable="true" data-type="video" ondragstart="onPalDragStart(event)" onclick="addBlock('video')"><span class="pal-icon">🎬</span><span>영상</span></button>
        <button class="pal-item" draggable="true" data-type="divider" ondragstart="onPalDragStart(event)" onclick="addBlock('divider')"><span class="pal-icon">➖</span><span>구분선</span></button>
        <button class="pal-item" draggable="true" data-type="spacer" ondragstart="onPalDragStart(event)" onclick="addBlock('spacer')"><span class="pal-icon">⬜</span><span>여백</span></button>
      </div>
      <h4>액션</h4>
      <div class="pal-grid">

const canvas = document.getElementById('canvas');

const FREE_TYPES = ['plainblock','image','video','layer'];
const MAX_IMAGE_EDGE = 1800;
const IMAGE_QUALITY = 0.86;
const STORAGE_WARN_BYTES = 4.2 * 1024 * 1024;
const undoStack = [];
let isRestoring = false;

function snapshotState(){
  const page = document.querySelector('.page');
  return JSON.stringify({
    title: document.getElementById('pageTitleInput').value,
    html: canvas.innerHTML,
    canvasBg: document.getElementById('canvasWrap').style.background || '',
    pageStyle: page.getAttribute('style') || '',
    accent: document.documentElement.style.getPropertyValue('--accent') || '',
    accentLight: document.documentElement.style.getPropertyValue('--accent-light') || ''
  });
}
function applyState(raw){
  const data = JSON.parse(raw);
  canvas.innerHTML = data.html || '';
  document.getElementById('pageTitleInput').value = data.title || '제목 없는 페이지';
  document.getElementById('canvasWrap').style.background = data.canvasBg || '';
  const page = document.querySelector('.page');
  if(data.pageStyle) page.setAttribute('style', data.pageStyle); else page.removeAttribute('style');
  if(data.accent) document.documentElement.style.setProperty('--accent', data.accent); else document.documentElement.style.removeProperty('--accent');
  if(data.accentLight) document.documentElement.style.setProperty('--accent-light', data.accentLight); else document.documentElement.style.removeProperty('--accent-light');
  canvas.querySelectorAll('.layer-stack').forEach(startLayerCycle);
  canvas.querySelectorAll(':scope > .block').forEach(b=>{ if(FREE_TYPES.includes(b.dataset.type)) observeFreeBlock(b); });
  updateCanvasExtent();
  clearInspector();
}
function rememberState(){
  if(isRestoring) return;
  const snap = snapshotState();
  if(undoStack[undoStack.length - 1] !== snap){
    undoStack.push(snap);
    if(undoStack.length > 80) undoStack.shift();
  }
}
function undoAction(){
  if(!undoStack.length){ showToast('되돌릴 내용이 없어요'); return; }
  isRestoring = true;
  applyState(undoStack.pop());
  isRestoring = false;
  showToast('되돌렸어요 ✓');
}
document.addEventListener('keydown', e=>{
  const tag = (e.target.tagName || '').toLowerCase();
  const editingText = e.target.isContentEditable || ['input','textarea','select'].includes(tag);
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !editingText){
    e.preventDefault();
    undoAction();
    return;
  }
  const block = canvas.querySelector('.block.selected');
  if(!block || editingText) return;
  const step = e.shiftKey ? 10 : 1;
  if(e.key === 'ArrowLeft'){ e.preventDefault(); nudgeSelected(-step,0); }
  else if(e.key === 'ArrowRight'){ e.preventDefault(); nudgeSelected(step,0); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); nudgeSelected(0,-step); }
  else if(e.key === 'ArrowDown'){ e.preventDefault(); nudgeSelected(0,step); }
});
canvas.addEventListener('focusin', e=>{
  if(e.target.isContentEditable) rememberState();
});
document.getElementById('pageTitleInput').addEventListener('focus', rememberState);

function togglePanel(which){
  document.body.classList.toggle(which + '-open');
  const other = which === 'palette' ? 'inspector' : 'palette';
  document.body.classList.remove(other + '-open');
}
document.addEventListener('click', e=>{
  if(!document.body.classList.contains('palette-open') && !document.body.classList.contains('inspector-open')) return;
  if(e.target.closest('#palette') || e.target.closest('#inspector') || e.target.closest('.mobile-toggle')) return;
  document.body.classList.remove('palette-open','inspector-open');
});

function estimateBytes(str){
  return new Blob([str || '']).size;
}
function formatBytes(bytes){
  if(bytes > 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + 'MB';
  if(bytes > 1024) return Math.round(bytes / 1024) + 'KB';
  return bytes + 'B';
}
function getTopZ(){
  return Math.max(50, ...Array.from(canvas.querySelectorAll(':scope > .block')).map(b=>parseInt(b.style.zIndex || '50', 10) || 50));
}

function createBlockElement(type){
  const div = document.createElement('div');
  div.className = 'block';
  div.dataset.type = type;
  if(['image','video','layer'].includes(type)) div.classList.add('chrome-off');
  const toolbar = FREE_TYPES.includes(type)
    ? `<div class="block-toolbar">
        <button title="드래그해서 이동" class="drag-handle" onmousedown="startFreeDrag(event,this)">⠿</button>
        <button title="복제" onclick="event.stopPropagation();duplicateBlock(this)">⧉</button>
        <button title="삭제" onclick="event.stopPropagation();deleteBlock(this)">✕</button>
      </div>`
    : `<div class="block-toolbar">
        <button title="위로" onclick="event.stopPropagation();moveBlock(this,-1)">▲</button>
        <button title="아래로" onclick="event.stopPropagation();moveBlock(this,1)">▼</button>
        <button title="복제" onclick="event.stopPropagation();duplicateBlock(this)">⧉</button>
        <button title="삭제" onclick="event.stopPropagation();deleteBlock(this)">✕</button>
      </div>`;
  div.innerHTML = `<div class="block-tag">${TYPE_LABELS[type]}</div>` + toolbar + TEMPLATES[type];
  return div;
}

function addBlock(type){
  rememberState();
  const el = createBlockElement(type);
  document.body.classList.remove('palette-open','inspector-open');
  if(FREE_TYPES.includes(type)){
    const n = canvas.querySelectorAll('.block[data-type="'+type+'"]').length;
    const offset = 40 + (n % 6) * 24;
    el.style.position = 'absolute';
    el.style.left = offset + 'px';
    el.style.top = offset + 'px';
    if(type === 'plainblock'){ el.style.width = '320px'; }
    else if(type === 'image'){ el.style.width = '340px'; el.style.height = '260px'; }
    else if(type === 'video'){ el.style.width = '380px'; el.style.height = '230px'; }
    else if(type === 'layer'){ el.style.width = '320px'; el.style.height = '260px'; }
    el.style.zIndex = getTopZ() + 10;
    canvas.appendChild(el);
    observeFreeBlock(el);
  } else {
    const sel = canvas.querySelector('.block.selected');
    if(sel && sel.nextElementSibling){ canvas.insertBefore(el, sel.nextElementSibling); }
    else { canvas.appendChild(el); }
  }
  selectBlock(el);
  el.scrollIntoView({behavior:'smooth', block:'center'});
  updateCanvasExtent();
}

// 자유배치 블록이 캔버스(메인 섹션) 밖으로 밀려나지 않도록, 페이지 높이를 내용에 맞춰 늘려줌
function updateCanvasExtent(){
  let maxBottom = 0;
  canvas.querySelectorAll(':scope > .block').forEach(b=>{
    if(FREE_TYPES.includes(b.dataset.type)){
      const top = parseFloat(b.style.top) || 0;
      maxBottom = Math.max(maxBottom, top + b.offsetHeight);
    }
  });
  canvas.style.minHeight = maxBottom > 0 ? (maxBottom + 40) + 'px' : '';
}
const freeBlockResizeObserver = (typeof ResizeObserver !== 'undefined') ? new ResizeObserver(()=> updateCanvasExtent()) : null;
function observeFreeBlock(el){
  if(freeBlockResizeObserver) freeBlockResizeObserver.observe(el);
}

function startFreeDrag(e, handle){
  rememberState();
  e.preventDefault();
  e.stopPropagation();
  const block = handle.closest('.block');
  selectBlock(block);
  const pageEl = block.closest('.page');
  const startX = e.clientX, startY = e.clientY;
  const startLeft = parseFloat(block.style.left) || 0;
  const startTop = parseFloat(block.style.top) || 0;
  function onMove(ev){
    const dx = ev.clientX - startX;
    const dy = ev.clientY - startY;
    let newLeft = startLeft + dx;
    let newTop = startTop + dy;
    const maxLeft = Math.max(0, pageEl.clientWidth - block.offsetWidth);
    newLeft = Math.max(0, Math.min(newLeft, maxLeft));
    newTop = Math.max(0, newTop);
    block.style.left = newLeft + 'px';
    block.style.top = newTop + 'px';
    updateCanvasExtent();
  }
  function onUp(){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    resolveOverlaps(block);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

// 블록을 다른 블록 위에 겹쳐 놓으면, 겹친 블록을 자동으로 아래로 밀어서 자리를 만들어줌
function resolveOverlaps(movedBlock){
  const blocks = Array.from(canvas.querySelectorAll(':scope > .block')).filter(b => FREE_TYPES.includes(b.dataset.type));
  let changed = true, iterations = 0;
  while(changed && iterations < 30){
    changed = false;
    iterations++;
    for(const a of blocks){
      for(const b of blocks){
        if(a === b || b === movedBlock) continue;
        const aTop = parseFloat(a.style.top) || 0, aLeft = parseFloat(a.style.left) || 0;
        const aBottom = aTop + a.offsetHeight, aRight = aLeft + a.offsetWidth;
        const bTop = parseFloat(b.style.top) || 0, bLeft = parseFloat(b.style.left) || 0;
        const bBottom = bTop + b.offsetHeight, bRight = bLeft + b.offsetWidth;
        const hOverlap = aLeft < bRight && aRight > bLeft;
        const vOverlap = aTop < bBottom && aBottom > bTop;
        if(hOverlap && vOverlap && aTop <= bTop + 0.5){
          const newTop = aBottom + 12;
          if(newTop > bTop + 0.5){ b.style.top = newTop + 'px'; changed = true; }
        }
      }
    }
  }
  updateCanvasExtent();
}

function onPalDragStart(e){
  e.dataTransfer.setData('text/plain', e.currentTarget.dataset.type);
}
canvas.addEventListener('dragover', e=>{ e.preventDefault(); });
canvas.addEventListener('drop', e=>{
  e.preventDefault();
  const type = e.dataTransfer.getData('text/plain');
  if(!type || !TEMPLATES[type]) return;
  rememberState();
  const el = createBlockElement(type);
  if(FREE_TYPES.includes(type)){
    el.style.position = 'absolute';
    el.style.left = Math.max(0, e.offsetX - 80) + 'px';
    el.style.top = Math.max(0, e.offsetY - 40) + 'px';
    if(type === 'plainblock'){ el.style.width = '320px'; }
    else if(type === 'image'){ el.style.width = '340px'; el.style.height = '260px'; }
    else if(type === 'video'){ el.style.width = '380px'; el.style.height = '230px'; }
    else if(type === 'layer'){ el.style.width = '320px'; el.style.height = '260px'; }
    el.style.zIndex = getTopZ() + 10;
    canvas.appendChild(el);
    observeFreeBlock(el);
    selectBlock(el);
    updateCanvasExtent();
    return;
  }
  const after = getDragAfterElement(e.clientY);
  if(after == null) canvas.appendChild(el); else canvas.insertBefore(el, after);
  selectBlock(el);
  el.scrollIntoView({behavior:'smooth', block:'center'});
});
function getDragAfterElement(y){
  const blocks = [...canvas.querySelectorAll(':scope > .block')];
  return blocks.reduce((closest, child)=>{
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height/2;
    if(offset < 0 && offset > closest.offset){ return {offset, element: child}; }
    return closest;
  }, {offset:-Infinity, element:null}).element;
}

function moveBlock(btn, dir){
  rememberState();
  const block = btn.closest('.block');
  if(dir < 0 && block.previousElementSibling) block.parentNode.insertBefore(block, block.previousElementSibling);
  else if(dir > 0 && block.nextElementSibling) block.parentNode.insertBefore(block.nextElementSibling, block);
  selectBlock(block);
}
function duplicateBlock(btn){
  rememberState();
  const block = btn.closest('.block');
  const clone = block.cloneNode(true);
  if(FREE_TYPES.includes(clone.dataset.type)){
    clone.style.left = ((parseFloat(clone.style.left) || 0) + 24) + 'px';
    clone.style.top = ((parseFloat(clone.style.top) || 0) + 24) + 'px';
    clone.style.zIndex = getTopZ() + 10;
    observeFreeBlock(clone);
  }
  block.after(clone);
  selectBlock(clone);
  const stack = clone.querySelector('.layer-stack');
  if(stack) startLayerCycle(stack);
  updateCanvasExtent();
}
function deleteBlock(btn){
  const block = btn.closest('.block');
  if(confirm('이 블록을 삭제할까요?')){
    rememberState();
    const stack = block.querySelector('.layer-stack');
    if(stack) stopLayerCycle(stack);
    if(freeBlockResizeObserver) freeBlockResizeObserver.unobserve(block);
    block.remove();
    clearInspector();
    updateCanvasExtent();
  }
}

// 레이어(다중 이미지 적층 전환)
const layerTimers = new WeakMap();
function startLayerCycle(stack){
  stopLayerCycle(stack);
  const items = Array.from(stack.querySelectorAll('.layer-item')).filter(el => el.classList.contains('has-img'));
  if(items.length < 2) return;
  const interval = Math.max(0.1, parseFloat(stack.dataset.interval) || 3);
  const mode = stack.dataset.mode || 'sequential';
  let idx = items.findIndex(el => el.classList.contains('active'));
  if(idx < 0) idx = 0;
  const timer = setInterval(()=>{
    items.forEach(el => el.classList.remove('active'));
    idx = (mode === 'random') ? Math.floor(Math.random() * items.length) : (idx + 1) % items.length;
    items[idx].classList.add('active');
  }, interval * 1000);
  layerTimers.set(stack, timer);
}
function stopLayerCycle(stack){
  const t = layerTimers.get(stack);
  if(t) clearInterval(t);
}
function triggerLayerSlotUpload(idx){
  const block = canvas.querySelector('.block.selected');
  if(!block) return;
  const item = block.querySelectorAll('.layer-item')[idx];
  if(!item) return;
  rememberState();
  uploadTarget = item;
  document.getElementById('imgInput').click();
}
function setLayerInterval(v){
  const stack = canvas.querySelector('.block.selected .layer-stack');
  if(!stack) return;
  rememberState();
  stack.dataset.interval = v;
  startLayerCycle(stack);
}
function setLayerMode(mode){
  const stack = canvas.querySelector('.block.selected .layer-stack');
  if(!stack) return;
  rememberState();
  stack.dataset.mode = mode;
  startLayerCycle(stack);
}

document.querySelector('.page').addEventListener('click', e=>{
  const block = e.target.closest('.block');
  if(block){ selectBlock(block); }
  else { selectPage(); }
});

function selectBlock(block){
  canvas.querySelectorAll('.block.selected').forEach(b=>b.classList.remove('selected'));
  document.querySelector('.page').classList.remove('selected-page');
  block.classList.add('selected');
  buildInspector(block);
  if(window.innerWidth <= 980) document.body.classList.add('inspector-open');
}
function selectPage(){
  canvas.querySelectorAll('.block.selected').forEach(b=>b.classList.remove('selected'));
  document.querySelector('.page').classList.add('selected-page');
  buildPageInspector();
}
function clearInspector(){
  document.querySelector('.page').classList.remove('selected-page');
  document.getElementById('inspectorBody').innerHTML = '<p class="insp-empty">블록을 선택하면<br>여기서 스타일을 바꿀 수 있어요.</p>';
}
function buildPageInspector(){
  const page = document.querySelector('.page');
  let html = `<div style="margin-bottom:4px"><span class="insp-tag">메인 섹션</span></div>`;
  html += `<label class="insp-label">배경색</label><input type="color" value="#faf8f4" onchange="setPageBg(this.value)">`;
  html += `<label class="insp-label">테두리</label>
    <div class="insp-btnrow">
      <button onclick="setPageBorder('none')">없음</button>

function lighten(hex, amt){
  const num = parseInt(hex.slice(1), 16);
  let r = (num>>16) + amt, g = ((num>>8)&0xff) + amt, b = (num&0xff) + amt;
  r = Math.min(255, Math.max(0, r)); g = Math.min(255, Math.max(0, g)); b = Math.min(255, Math.max(0, b));
  return '#' + ((1<<24) + (r<<16) + (g<<8) + b).toString(16).slice(1);
}

function applyFreeformStyle(prop, value){
  rememberState();
  const freeform = canvas.querySelector('.block.selected .freeform');
  if(!freeform) return;
  const sel = window.getSelection();
  if(sel && sel.rangeCount && !sel.isCollapsed && freeform.contains(sel.anchorNode) && freeform.contains(sel.focusNode)){
    const range = sel.getRangeAt(0);
    const span = document.createElement('span');
    span.style[prop] = value;
    const contents = range.extractContents();
    span.appendChild(contents);
    range.insertNode(span);
    sel.removeAllRanges();
  } else {
    freeform.style[prop] = value;
  }
}
function setFreeformFontSize(v){ applyFreeformStyle('fontSize', v + 'px'); }

function alignFreeBlock(block, a){
  if(!block || !FREE_TYPES.includes(block.dataset.type)) return;
  const pageEl = block.closest('.page');
  const maxLeft = Math.max(0, pageEl.clientWidth - block.offsetWidth);
  if(a === 'left') block.style.left = '0px';
  else if(a === 'center') block.style.left = Math.round(maxLeft / 2) + 'px';
  else if(a === 'right') block.style.left = maxLeft + 'px';
  block.style.marginLeft = '0';
  block.style.marginRight = '0';
  updateCanvasExtent();

function nudgeBlock(block, dx, dy){
  if(!block) return;
  if(FREE_TYPES.includes(block.dataset.type)){
    const pageEl = block.closest('.page');
    const maxLeft = Math.max(0, pageEl.clientWidth - block.offsetWidth);
    const left = Math.max(0, Math.min((parseFloat(block.style.left) || 0) + dx, maxLeft));
    const top = Math.max(0, (parseFloat(block.style.top) || 0) + dy);
    block.style.left = left + 'px';
    block.style.top = top + 'px';
  } else {
    const mt = parseFloat(block.style.marginTop) || 0;
    const ml = parseFloat(block.style.marginLeft) || 0;
    block.style.marginTop = (mt + dy) + 'px';
    block.style.marginLeft = (ml + dx) + 'px';
  }
  updateCanvasExtent();
}

  const nx = Math.max(0, Math.min(100, x + dx));

    html += `<label class="insp-label">레이어 (최대 5장, 순서대로 재생)</label>` + rows;
    html += `<label class="insp-label">전환 간격 (초 · 0.1초 단위)</label><input type="number" step="0.1" min="0.1" max="60" value="${stack.dataset.interval || '3'}" onchange="setLayerInterval(this.value)">`;
    html += `<label class="insp-label">전환 순서</label>
      <div class="insp-btnrow">
        <button onclick="setLayerMode('sequential')">순차</button>
        <button onclick="setLayerMode('random')">랜덤</button>
      </div>`;
    html += `<p class="insp-note">* 이미지를 2장 이상 올리면 자동으로 재생을 시작해요. 지금은 슬롯 순서(1→2→3→4→5)대로 순차 재생돼요. ⠿로 위치, 모서리로 크기를 조절할 수 있어요.</p>`;
  }
  if(type === 'spacer'){
    html += `<label class="insp-label">높이</label><input type="range" min="20" max="240" value="60" oninput="setSpacerHeight(this.value)">`;
  }
  if(type === 'cards'){
    html += `<label class="insp-label">카드 개수</label>
      <div class="insp-btnrow">
        <input type="number" min="1" max="12" value="3" id="cardCountInput" style="text-align:center;padding:8px;border-radius:8px;border:1px solid #333;background:#202623;color:#EDEAE3;">
        <button onclick="setCardCount(document.getElementById('cardCountInput').value)">적용</button>
      </div>`;
  }
  if(type === 'contact'){
    html += `<p class="insp-note">* 실제로 메일이 전송되게 하려면 폼을 Formspree 같은 외부 서비스에 연결해야 해요.</p>`;
  }

  html += `<button class="insp-delete" onclick="deleteSelected()">이 블록 삭제</button>`;
  document.getElementById('inspectorBody').innerHTML = html;
}

// 이미지 업로드
let uploadTarget = null;
function triggerImgUpload(el, ev){
  const block = el.closest('.block');
  if(block) selectBlock(block);
  if(ev && ev.altKey){
    ev.preventDefault();
    ev.stopPropagation();
    document.body.classList.add('inspector-open');
    return;
  }
  if(ev && el.classList.contains('has-img')){
    const r = el.getBoundingClientRect();
    const edgeX = r.width * 0.15;
    const edgeY = r.height * 0.15;
    const x = ev.clientX - r.left;
    const y = ev.clientY - r.top;
    const nearEdge = x < edgeX || x > r.width - edgeX || y < edgeY || y > r.height - edgeY;
    if(nearEdge){
      ev.preventDefault();
      ev.stopPropagation();
      document.body.classList.add('inspector-open');
      return;
    }
  }
  rememberState();
  uploadTarget = el;
  document.getElementById('imgInput').click();
}
function compressImageFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = function(e){
      const img = new Image();
      img.onerror = reject;
      img.onload = function(){
        const scale = Math.min(1, MAX_IMAGE_EDGE / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const type = file.type === 'image/png' && file.size < 800000 ? 'image/png' : 'image/jpeg';
        resolve(c.toDataURL(type, type === 'image/jpeg' ? IMAGE_QUALITY : undefined));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
document.getElementById('imgInput').addEventListener('change', function(){
  const file = this.files[0];
  if(!file || !uploadTarget) return;
  compressImageFile(file).then(src=>{
    uploadTarget.innerHTML = `<img src="${src}" alt="" style="object-position:50% 50%;">`;
    uploadTarget.classList.add('has-img');
    if(uploadTarget.classList.contains('layer-item')){
      const stack = uploadTarget.closest('.layer-stack');
      if(stack && !stack.querySelector('.layer-item.active')){ uploadTarget.classList.add('active'); }
      if(stack) startLayerCycle(stack);
      const block = uploadTarget.closest('.block');
      if(block && block.classList.contains('selected')) buildInspector(block);
    }
    updateCanvasExtent();
    showToast('이미지를 가볍게 넣었어요 ✓');
  }).catch(()=>{
    showToast('이미지를 읽지 못했어요');
  });
  this.value = '';
});

// 영상 URL (유튜브)
function promptVideoUrl(container){
  const url = prompt('유튜브 영상 URL을 입력하세요\n예: https://www.youtube.com/watch?v=XXXXXXXXXXX');
  if(!url) return;
  const m = url.match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/)([A-Za-z0-9_-]{6,})/);
  const id = m ? m[1] : null;
  if(!id){ alert('유튜브 링크에서 영상 ID를 찾지 못했어요. 링크를 다시 확인해주세요.'); return; }
  rememberState();
  const src = `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&loop=1&playlist=${id}&playsinline=1&rel=0&enablejsapi=0`;
  container.innerHTML = `<div class="video-wrap"><iframe src="${src}" referrerpolicy="origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe><a class="youtube-fallback" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">YouTube에서 열기</a></div>`;
}

// 저장 / 불러오기 / 초기화
const STORAGE_KEY = 'co2co_editor_v1';
function savePage(){
  const page = document.querySelector('.page');
  const data = {
    title: document.getElementById('pageTitleInput').value,
    html: canvas.innerHTML,
    canvasBg: document.getElementById('canvasWrap').style.background || '',
    pageStyle: page.getAttribute('style') || '',
    accent: document.documentElement.style.getPropertyValue('--accent') || '',
    accentLight: document.documentElement.style.getPropertyValue('--accent-light') || ''
  };
  const raw = JSON.stringify(data);
  try{
    localStorage.setItem(STORAGE_KEY, raw);
    const size = estimateBytes(raw);
    showToast('저장되었어요 · ' + formatBytes(size));
    if(size > STORAGE_WARN_BYTES){
      setTimeout(()=>showToast('이미지가 많아요. 내보내기도 함께 해두세요'), 250);
    }
  }catch(e){
    alert('브라우저 저장 공간이 부족해 저장하지 못했어요.\n이미지를 줄이거나 HTML 내보내기를 먼저 해주세요.');
  }
}
function resetPage(){
  if(!confirm('페이지를 처음부터 다시 시작할까요? 저장된 내용도 함께 삭제돼요.')) return;
  rememberState();
  canvas.innerHTML = '';
  document.getElementById('pageTitleInput').value = '제목 없는 페이지';
  document.getElementById('canvasWrap').style.background = '';
  document.querySelector('.page').removeAttribute('style');
  document.documentElement.style.removeProperty('--accent');
  document.documentElement.style.removeProperty('--accent-light');
  localStorage.removeItem(STORAGE_KEY);
  clearInspector();
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}
function loadPage(manual){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      rememberState();
      const data = JSON.parse(raw);
      canvas.innerHTML = data.html || '';
      document.getElementById('pageTitleInput').value = data.title || '제목 없는 페이지';
      if(data.canvasBg) document.getElementById('canvasWrap').style.background = data.canvasBg;
      if(data.pageStyle) document.querySelector('.page').setAttribute('style', data.pageStyle);
      if(data.accent) document.documentElement.style.setProperty('--accent', data.accent);
      if(data.accentLight) document.documentElement.style.setProperty('--accent-light', data.accentLight);
      canvas.querySelectorAll('.layer-stack').forEach(startLayerCycle);
      canvas.querySelectorAll(':scope > .block').forEach(b=>{ if(FREE_TYPES.includes(b.dataset.type)) observeFreeBlock(b); });
      updateCanvasExtent();
      clearInspector();
      if(manual) showToast('저장된 내용을 불러왔어요 ✓');
    } else if(manual){
      showToast('저장된 내용이 없어요');
    }
  }catch(e){}
}

// 내보내기 (완성된 사이트 HTML 파일 다운로드)
function exportHTML(){
  const titleVal = (document.getElementById('pageTitleInput').value || '').trim() || '제목 없는 페이지';
  const clone = canvas.cloneNode(true);
  clone.querySelectorAll('.block-tag,.block-toolbar').forEach(e=>e.remove());
  clone.querySelectorAll('.block').forEach(b=>{ b.classList.remove('selected'); b.style.resize=''; b.style.overflow=''; });
  clone.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));
  clone.querySelectorAll('[onclick]').forEach(e=>e.removeAttribute('onclick'));

  let siteCSS = document.getElementById('siteStyles').textContent;
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  const accentLight = getComputedStyle(document.documentElement).getPropertyValue('--accent-light').trim();
  const canvasBg = document.getElementById('canvasWrap').style.background;
  siteCSS += `:root{--accent:${accent};--accent-light:${accentLight};}`;
  if(canvasBg){ siteCSS += `body{background:${canvasBg};}`; }
  siteCSS += getResponsiveExportCSS();

  const pageStyleAttr = (document.querySelector('.page').getAttribute('style') || '').replace(/"/g,'&quot;');
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  const layerRuntime = clone.querySelector('.layer-stack') ? (
    '\n<' + 'script>\n(function(){\n' +
    '  function cycle(stack){\n' +
    "    var items = Array.prototype.filter.call(stack.querySelectorAll('.layer-item'), function(el){return el.classList.contains('has-img');});\n" +
    '    if(items.length < 2) return;\n' +
    "    var interval = Math.max(0.1, parseFloat(stack.dataset.interval) || 3);\n" +
    "    var mode = stack.dataset.mode || 'sequential';\n" +
    "    var idx = items.findIndex(function(el){return el.classList.contains('active');});\n" +
    '    if(idx < 0) idx = 0;\n' +
    '    setInterval(function(){\n' +
    "      items.forEach(function(el){ el.classList.remove('active'); });\n" +
    "      idx = (mode === 'random') ? Math.floor(Math.random()*items.length) : (idx+1) % items.length;\n" +
    "      items[idx].classList.add('active');\n" +
    '    }, interval*1000);\n' +
    '  }\n' +
    "  document.querySelectorAll('.layer-stack').forEach(cycle);\n" +
    '})();\n<' + '/script>\n'
  ) : '';

  const doc = '<!DOCTYPE html>\n<html lang="ko">\n<head>\n<meta charset="UTF-8">\n' +
    '<meta name="referrer" content="strict-origin-when-cross-origin">\n' +
    '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
    '<title>' + esc(titleVal) + '</title>\n' +
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
    '<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">\n' +
    '<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">\n' +
    '<style>' + siteCSS + '</style>\n</head>\n<body>\n<div class="page" style="' + pageStyleAttr + '">' + clone.innerHTML + '</div>\n<div class="co2co-credit">made with co2co</div>\n' + layerRuntime + '</body>\n</html>';

  const blob = new Blob([doc], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const safeName = titleVal.replace(/[^\w\-가-힣ㄱ-ㅎㅏ-ㅣ ]+/g,'').trim().replace(/\s+/g,'_') || 'co2co-page';
  a.download = safeName + '.html';
  document.body.appendChild(a);
  a.click();
  a.remove();
  showToast('페이지를 내보냈어요 ✓');
}
